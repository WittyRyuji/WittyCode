# The checks every push and pull request gets. The Windows image, Python and Node are pinned to the versions development
# uses (no "-latest" image that can change underneath), and every action to a full commit SHA.
# Not run here, by choice: the whole-window tests (tests/test_app_e2e.py, tests/test_shell.py), the mutation scripts in
# sandbox/ and anything that calls a real model. They run on a developer's machine (docs/development.md).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Page (typecheck, unit, page checks)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build the page
        run: npm run build:app
      - name: Unit tests
        run: npm run unit
      - name: Page checks (design page, headless Edge)
        run: node scripts/check.mjs
      - name: Page checks (live page against the scripted backend)
        run: node scripts/check-live.mjs

  python:
    name: Python tests
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Install the pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Tests (without the whole-window ones)
        run: python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_app_e2e.py --ignore=tests/test_shell.py
