[project]
name = "wittycode"
version = "0.2.1"
description = "WittyCode: a Windows desktop app for coding agents, with its own agent loop (ChatGPT Plan, API providers, Bedrock) and optional Devin, PySide6 + Qt WebEngine + React"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "NiuXiao@WittyLoong Studio" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6==6.12.0",
    "qasync==0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "ui: drives the real Qt WebEngine page (runs offscreen, no live model calls)",
]